apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: gpu-claim
  namespace: dra-lab
spec:
  devices:
    requests:
    - name: gpu
      exactly:
        deviceClassName: gpu.nvidia.com
        tolerations:
        - key: example.com/unhealthy
          operator: Equal
          value: scheduled
          effect: NoSchedule
