apiVersion: v1
kind: Service
metadata:
  name: vector-store-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rag-vector-store.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: vector-store
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
