apiVersion: v1
kind: Service
metadata:
  name: rag-ui
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rag-frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: rag-ui
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      nodePort: {{ .Values.service.nodePort }}
